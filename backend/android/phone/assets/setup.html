<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Homemote</title>
<style>
:root {
  --bg: #E9EDF6; --surface: #FFFFFF; --text: #16203A; --muted: #5B6683; --line: #D5DCEB;
  --accent: #6A4DF0; --accent-2: #8B3FE0; --err: #C2334D;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0E1630; --surface: #17213F; --text: #E8ECF7; --muted: #8D97B5; --line: #2A3863; --err: #FF7A90; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; width: 100%; max-width: 520px; margin: 0 auto; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 6px 20px rgba(91, 75, 245, .35); }
.brand b { font-size: 1.5rem; letter-spacing: -.01em; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: .85rem; }
h1 { font-size: 1.35rem; margin: 6px 0 0; line-height: 1.25; }
p { margin: 0; }
.muted { color: var(--muted); }
ol { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
ol li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
ol li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: .9rem; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.gear { display: inline-block; width: 1.1em; height: 1.1em; vertical-align: -0.18em; }
button, input { font: inherit; }
.btn { width: 100%; border: 0; border-radius: 14px; padding: 15px 18px; font-weight: 700; font-size: 1.05rem; cursor: pointer;
  color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; font-size: .98rem; }
.btn:disabled { opacity: .6; }
.manual { display: grid; gap: 10px; }
.manual input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
.msg { min-height: 1.5em; font-size: .95rem; }
.msg.err { color: var(--err); }
.detail { margin-top: -12px; font: 12px/1.45 ui-monospace, monospace; color: var(--muted); word-break: break-word; user-select: text; }
.hidden { display: none !important; }
.scanner { position: relative; border-radius: 18px; overflow: hidden; background: #000; aspect-ratio: 3 / 4; }
.scanner video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner .frame { position: absolute; inset: 18%; border: 3px solid rgba(255,255,255,.9); border-radius: 18px;
  box-shadow: 0 0 0 999px rgba(0,0,0,.35); }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 0 18px; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a7bf0"/><stop offset="1" stop-color="#8b3fe0"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#g)"/><g transform="rotate(-22 32 32)"><rect x="21" y="6" width="22" height="52" rx="11" fill="#fff"/><circle cx="32" cy="20" r="6.5" fill="none" stroke="#5a5df0" stroke-width="3.2"/><circle cx="32" cy="20" r="2" fill="#5a5df0"/><circle cx="27.5" cy="35" r="2.4" fill="#8b8fd8"/><circle cx="36.5" cy="35" r="2.4" fill="#8b8fd8"/><rect x="28" y="42" width="8" height="3.4" rx="1.7" fill="#8b8fd8"/></g></svg>
    <div><b>Homemote</b><small>for Google TV</small></div>
  </div>

  <section id="intro">
    <h1 data-t="title"></h1>
    <p class="muted" style="margin-top:8px" data-t="lead"></p>
  </section>

  <ol id="steps">
    <li><span data-t="s1"></span></li>
    <li><span data-t="s2"></span></li>
    <li><span data-t="s3"></span></li>
  </ol>

  <div id="scan-box" class="hidden">
    <div class="scanner"><video id="video" playsinline muted></video><div class="frame"></div></div>
  </div>

  <div id="busy" class="hidden"><div class="spinner"></div></div>
  <p id="msg" class="msg" role="status" aria-live="polite"></p>
  <p id="detail" class="detail hidden"></p>

  <div id="actions" style="display:grid;gap:10px">
    <button class="btn" id="scan" type="button" data-t="scan"></button>
    <button class="btn ghost hidden" id="cancel" type="button" data-t="cancel"></button>
    <button class="btn ghost" id="show-manual" type="button" data-t="manual"></button>
  </div>

  <form id="manual-form" class="manual hidden">
    <p class="muted" data-t="manualText"></p>
    <input id="manual-url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="http://192.168.1.20:888">
    <button class="btn" type="submit" data-t="connect"></button>
  </form>
</main>
<footer id="ver"></footer>

const lang = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase().split("-")[0];
const L = T[lang] || T.en;
const t = (k, p = {}) => (L[k] ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => x === "gear" ? GEAR : (p[x] ?? ""));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (s) => document.querySelector(s);
document.documentElement.lang = T[lang] ? lang : "en";
document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
try { $("#ver").textContent = t("version", { v: window.HM ? HM.version() : "?" }); } catch (e) {}

function msg(text, err) { const m = $("#msg"); m.textContent = text || ""; m.classList.toggle("err", !!err); const d = $("#detail"); if (d) d.classList.add("hidden"); }
function busy(on) { $("#busy").classList.toggle("hidden", !on); $("#scan").disabled = on; }

/* ---- čtečka QR: BarcodeDetector (když ho WebView má), jinak jsQR ---- */
let stream = null, timer = null, detector = null;
function stopCamera() {
  clearInterval(timer); timer = null;
  if (stream) { stream.getTracks().forEach(tr => tr.stop()); stream = null; }
  $("#scan-box").classList.add("hidden"); $("#cancel").classList.add("hidden");
  $("#scan").classList.remove("hidden"); $("#steps").classList.remove("hidden");
}
async function startCamera() {
  msg("");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
  } catch (e) { msg(t("noCam", { err: e.message || e.name }), true); return; }
  const v = $("#video"); v.srcObject = stream; await v.play().catch(() => {});
  $("#steps").classList.add("hidden"); $("#scan-box").classList.remove("hidden");
  $("#scan").classList.add("hidden"); $("#cancel").classList.remove("hidden");
  msg(t("aim"));
  try { if ("BarcodeDetector" in window) detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { detector = null; }
  const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", { willReadFrequently: true });
  let busyFrame = false;
  timer = setInterval(async () => {
    if (busyFrame || !v.videoWidth) return;
    busyFrame = true;
    try {
      let text = null;
      if (detector) {
        const codes = await detector.detect(v).catch(() => []);
        if (codes.length) text = codes[0].rawValue;
      }
      if (!text && window.jsQR) {
        const w = Math.min(v.videoWidth, 800), h = Math.round(v.videoHeight * w / v.videoWidth);
        canvas.width = w; canvas.height = h; ctx.drawImage(v, 0, 0, w, h);
        const code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
        if (code) text = code.data;
      }
      if (text) found(text);
    } finally { busyFrame = false; }
  }, 220);
}
function found(text) {
  if (!/^homemote:\/\/pair\?/i.test(text)) { msg(t("badQr"), true); return; }
  stopCamera();
  if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
  HM.qr(text);
}
function cameraDenied() { msg(t("camDenied"), true); }
function pairing() { stopCamera(); busy(true); msg(t("pairing")); }
function pairError(code) {
  busy(false);
  const [kind, detail] = String(code).split(/\|(.*)/s);
  const map = { "bad-qr": "badQr", unreachable: "unreachable", code: "code" };
  msg(map[kind] ? t(map[kind]) : t("failed", { err: code }), true);
  const d = $("#detail"); d.textContent = map[kind] && detail ? detail : ""; d.classList.toggle("hidden", !(map[kind] && detail));
}
$("#scan").onclick = () => { msg(""); HM.scan(); };
$("#cancel").onclick = () => { stopCamera(); msg(""); };
$("#show-manual").onclick = () => { $("#manual-form").classList.toggle("hidden"); $("#manual-url").focus(); };
$("#manual-form").onsubmit = (e) => {
  e.preventDefault();
  if (!HM.manual($("#manual-url").value)) msg(t("badUrl"), true);
};
