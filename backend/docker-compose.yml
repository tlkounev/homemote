# Homemote – any Linux with Docker: docker compose up -d
# Update: docker compose pull && docker compose up -d
# Develop from source instead: docker compose build (uses ./Dockerfile; APKs are then built at first start).
services:
  homemote-backend:
    image: ghcr.io/tlkounev/homemote-backend:latest
    build: .
    pull_policy: always
    container_name: homemote-backend
    restart: unless-stopped
    network_mode: host        # mDNS discovery of TVs needs the container directly in the home LAN
    volumes:
      - ./data:/data
    environment:
      PORT: "888"             # web UI + API port
