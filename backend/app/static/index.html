<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1630" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E9EDF6" media="(prefers-color-scheme: light)">
<title>Homemote</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E1630;
  --surface: #17213F;
  --surface-2: #1F2B50;
  --line: #2A3863;
  --text: #E8ECF7;
  --muted: #8D97B5;
  --bad: #F07178;
  --good: #6FD3A8;
  --warn: #F2B45A;
  --glow: 110, 140, 255;
  --glass-a: rgba(255,255,255,.11); --glass-b: rgba(255,255,255,.035); --glass-edge: rgba(255,255,255,.16);
  --glass-hi: rgba(255,255,255,.22); --pane: rgba(255,255,255,.05); --key: rgba(255,255,255,.07); --key-line: rgba(255,255,255,.12);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #E9EDF6;
    --surface: #FFFFFF;
    --surface-2: #F2F4FA;
    --line: #D3D9E8;
    --text: #16203A;
    --muted: #5D6886;
    --bad: #C2414B;
    --good: #1E8A5F;
    --warn: #C77A0A;
    --glass-a: rgba(255,255,255,.72); --glass-b: rgba(255,255,255,.42); --glass-edge: rgba(255,255,255,.9);
    --glass-hi: rgba(255,255,255,1); --pane: rgba(255,255,255,.45); --key: rgba(255,255,255,.7); --key-line: rgba(22,32,58,.12);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 400 16px/1.5 var(--body); min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid rgb(var(--glow)); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.err { color: var(--bad); font-size: .95rem; min-height: 1.2em; }

/* ---------- layout ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
header.top { display: flex; align-items: center; gap: 12px; padding: 4px 0 14px; }
header.top h1 { font-size: 1.15rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 10px; }
header.top h1 .brand-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
@media (max-width: 520px) {
  header.top h1 .brand-text { flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.1; }
  header.top h1 small { margin-left: 0 !important; padding-bottom: 0 !important; font-size: .7rem !important; }
  .lang-btn > span { display: none; }
  header.top { gap: 8px; } .top-right { gap: 8px !important; }
}
header.top h1 small { font-family: var(--body, inherit); font-size: .78rem; font-weight: 400; color: var(--muted); white-space: nowrap; }
header.top h1 img { border-radius: 7px; box-shadow: 0 4px 14px rgba(91, 75, 245, .35); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: .875rem; color: var(--muted); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.ok::before { background: var(--good); }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center; flex: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.icon-btn svg { width: 20px; height: 20px; }

/* záložky zařízení – přecházejí do horní hrany desky */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 0 22px; margin-bottom: -1px; position: relative; z-index: 2; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
  padding: 10px 18px; border-radius: 16px 16px 0 0; border: 1px solid var(--key-line); border-bottom: 0;
  background: var(--pane); color: var(--muted); font-family: var(--display); font-weight: 700; font-size: 1.3rem;
}
.tab[aria-selected=true] { background: var(--glass-a); color: var(--text); border-color: var(--glass-edge); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--good); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
.tab { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.tab.tab-dragging { position: relative; z-index: 3; color: var(--text); border-color: rgb(var(--glow)); box-shadow: 0 -6px 18px rgba(var(--glow), .35); transform: translateY(-3px); }
.tabs.tabs-dragging, .tabs.tabs-dragging .tab { cursor: grabbing; }

/* ambientní světlo v barvě aplikace za deskou */
.ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(42% 40% at 34% 46%, rgba(var(--glow), .6), rgba(var(--glow), 0) 72%), radial-gradient(28% 30% at 78% 58%, rgba(90, 110, 255, .22), transparent 70%);
  opacity: var(--glow-on, 1); transition: opacity .8s ease, background .8s ease; }
.wrap > *:not(.ambient) { position: relative; z-index: 1; }
.wrap > header.top { z-index: 30; }

/* deska zařízení */
.slab {
  border-radius: 30px; padding: 20px 24px 26px;
  background: linear-gradient(160deg, var(--glass-a), var(--glass-b) 45%, var(--glass-a));
  border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), 0 30px 80px rgba(0, 0, 0, .3);
  backdrop-filter: blur(26px) saturate(140%); -webkit-backdrop-filter: blur(26px) saturate(140%);
}
.slab-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; min-height: 40px; }
.tv-head { color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: 2px 14px; min-width: 0; flex: 1 1 auto; }
.tv-meta { margin-left: auto; font-size: .88rem; white-space: nowrap; flex: none; }
.slab-head > .icon-btn { flex: none; }
.slab-head > .icon-btn { background: var(--key); border-color: var(--key-line); }
.tab[aria-selected=true] { cursor: text; }
.tab-rename { display: inline-flex; align-items: center; gap: 10px; }
.tab-rename input { font: inherit; color: inherit; width: 14ch; min-width: 6ch; background: var(--key); border: 1px solid var(--key-line); border-radius: 8px; padding: 0 8px; }
.foot { text-align: center; color: var(--muted); font-size: .8rem; padding: 22px 0 0; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) { .slab-head { gap: 10px; } }
.rename-form { display: flex; gap: 8px; align-items: center; }
.rename-form input {
  min-width: 0; width: 16ch; font-family: var(--display); font-weight: 700; font-size: 1.1rem;
  background: var(--key); border: 1px solid var(--key-line); border-radius: 10px; padding: 4px 10px;
}
.rename-form .btn { padding: 7px 12px; }

/* tři části desky: pořadí si volí uživatel (úchyt nahoře) */
.zones { display: grid; gap: 22px; align-items: start; }
.zone { position: relative; min-width: 0; }
.zone.full { grid-column: 1 / -1; }
.zone.apps.full { padding-top: 6px; }
.grip {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%); z-index: 3;
  width: 56px; height: 20px; border: 1px solid transparent; background: none; color: var(--muted); opacity: 0;
  display: grid; place-items: center; cursor: grab; touch-action: none; border-radius: 10px;
  pointer-events: none; transition: opacity .18s ease, background .18s ease;
}
.zone.grip-near .grip, .zone.moving .grip, .grip:focus-visible {
  opacity: 1; pointer-events: auto; background: var(--key); border-color: var(--key-line);
}
.grip:hover { color: var(--text); }
.grip svg { width: 22px; height: 10px; }
.zone.drop-target { outline: 2px dashed rgb(var(--glow)); outline-offset: 6px; border-radius: 22px; }
.zone.moving { opacity: .5; }
@media (max-width: 900px) { .zones { grid-template-columns: 1fr !important; } .zone { grid-column: 1 / -1; } .slab { padding: 18px 16px 20px; border-radius: 24px; } .tab { font-size: 1.1rem; padding: 9px 14px; } .tabs { padding: 0 14px; } }

/* ---------- obrazovka: jediný výrazný prvek ---------- */
.screen-area { position: relative; }
.screen-box { position: relative; }
.screen {
  position: relative; aspect-ratio: 16 / 9; border-radius: 18px;
  background: #05070D; color: #F2F4FA;
  border: 8px solid #1A1D24; box-shadow: 0 1px 0 rgba(255,255,255,.06) inset;
  overflow: hidden; display: flex; flex-direction: column;
}
@media (max-width: 520px) { .screen { aspect-ratio: auto; min-height: 250px; border-width: 6px; } }
.screen-inner { flex: 1; display: flex; flex-direction: column; padding: clamp(16px, 3vw, 28px); gap: 10px; min-height: 0; }
.screen .app-row { display: flex; align-items: center; gap: 12px; color: #B9C0D4; font-size: .95rem; padding-right: 100px; }
.screen .app-row img, .app-fallback {
  width: 36px; height: 36px; border-radius: 9px; object-fit: cover; background: rgba(255,255,255,.08);
}
.app-fallback { display: grid; place-items: center; font-family: var(--display); font-weight: 700; color: #fff; }
.screen .title {
  font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 4.2vw, 2.9rem);
  line-height: 1.05; margin-top: auto; max-width: 24ch;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.screen .subtitle { color: #B9C0D4; font-size: 1.05rem; max-width: 60ch; }
.screen .state-msg { margin: auto 0; max-width: 46ch; }
.screen .state-msg h2 { font-size: clamp(1.3rem, 3vw, 2rem); margin-bottom: 6px; }
.screen .state-msg p { margin: 0 0 14px; color: #B9C0D4; }
.screen .err { color: #FF9AA2; }

/* kolečko hlasitosti v rohu obrazovky */
.vol-ring {
  position: absolute; top: 18px; right: 18px; width: 96px; height: 96px; z-index: 2;
  touch-action: none; cursor: grab; border: 0; padding: 0; background: none; color: #F2F4FA;
  border-radius: 50%;
}
.vol-ring:active { cursor: grabbing; }
.vol-ring svg { width: 100%; height: 100%; display: block; }
.vol-ring .num {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--display); font-weight: 700; font-size: 1.8rem; font-variant-numeric: tabular-nums;
}
.vol-ring.muted .num { font-size: .78rem; font-family: var(--body); font-weight: 700; }
@media (max-width: 520px) { .vol-ring { width: 74px; height: 74px; top: 14px; right: 14px; } .vol-ring .num { font-size: 1.4rem; } }

/* velký ukazatel hlasitosti uprostřed obrazovky */
.vol-osd {
  position: absolute; inset: 8px; display: grid; place-items: center; pointer-events: none; z-index: 3;
  opacity: 0; transition: opacity .25s ease;
}
.vol-osd.show { opacity: 1; }
.vol-osd .card {
  display: grid; justify-items: center; gap: 6px; padding: 22px 30px 18px; border-radius: 26px;
  background: rgba(5, 7, 13, .78); backdrop-filter: blur(8px); color: #F2F4FA;
}
.vol-osd .dial { position: relative; width: min(34vw, 170px); aspect-ratio: 1; }
.vol-osd svg { width: 100%; height: 100%; display: block; }
.vol-osd .big { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: clamp(2.4rem, 7vw, 3.6rem); font-variant-numeric: tabular-nums; }
.vol-osd .lbl { color: #B9C0D4; font-size: .95rem; }

.seek { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; color: #B9C0D4; font-size: .9rem; }
input[type=range].slider { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type=range].slider::-webkit-slider-runnable-track { height: 5px; border-radius: 3px;
  background: linear-gradient(to right, #F2F4FA var(--p, 0%), rgba(255,255,255,.2) var(--p, 0%)); }
input[type=range].slider::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.2); }
input[type=range].slider::-moz-range-progress { height: 5px; border-radius: 3px; background: #F2F4FA; }
input[type=range].slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6.5px; border-radius: 50%; background: #fff; border: 0; }
input[type=range].slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 0; }
input[type=range].slider:disabled { opacity: .35; }

.transport { display: flex; justify-content: center; gap: 10px; padding: 14px 0 4px; }
.transport button { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--key); border: 1px solid var(--key-line); }
.transport button.primary { width: 64px; height: 64px; background: var(--text); color: var(--bg); border: 0; }
.transport svg { width: 22px; height: 22px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px; border-radius: 12px; border: 0; font-weight: 700; background: #F2F4FA; color: #0E1630;
}
.btn.ghost { background: transparent; color: inherit; border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.code-input {
  font-family: var(--display); font-size: 1.8rem; letter-spacing: .3em; text-transform: uppercase;
  width: 9.5ch; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25);
  background: rgba(255,255,255,.06); color: #fff;
}
.inline-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- ovladač ---------- */
.remote-pane { background: var(--pane); border: 1px solid var(--key-line); border-radius: 24px; padding: 20px; display: grid; gap: 18px; justify-items: center; }
.remote[aria-disabled=true] .remote-pane { opacity: .45; pointer-events: none; }
.rbtn { background: var(--key); border: 1px solid var(--key-line); border-radius: 14px; height: 48px; min-width: 48px; display: grid; place-items: center; padding: 0 12px; font-size: .9rem; }
.rbtn svg { width: 22px; height: 22px; }
.rbtn:active, .dpad button:active, .transport button:active, .key:active { transform: scale(.96); }
.row { display: flex; gap: 10px; justify-content: center; width: 100%; }
.row .rbtn { flex: 1; }
.dpad { position: relative; width: 224px; height: 224px; border-radius: 50%; background: var(--key); border: 1px solid var(--key-line); }
.dpad button { position: absolute; background: transparent; border: 0; display: grid; place-items: center; color: var(--muted); }
.dpad button svg { width: 26px; height: 26px; }
.dpad .up { top: 0; left: 30%; width: 40%; height: 30%; }
.dpad .down { bottom: 0; left: 30%; width: 40%; height: 30%; }
.dpad .left { left: 0; top: 30%; width: 30%; height: 40%; }
.dpad .right { right: 0; top: 30%; width: 30%; height: 40%; }
.dpad .ok { top: 50%; left: 50%; width: 92px; height: 92px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--key); border: 1px solid var(--key-line); color: var(--text); font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.dpad .ok:active { transform: translate(-50%, -50%) scale(.96); }
.vol { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; gap: 10px; width: 100%; }
.vol .mid { display: grid; gap: 10px; align-content: space-between; }
.vol .mid .rbtn { width: 100%; }
.vol .rocker.vert { flex-direction: column; align-items: stretch; background: var(--key); }
.vol .rocker.vert button { width: 100%; height: 48px; }
.vol .rocker.vert button + button { border-left: 0; }
.vol .rocker .rlbl { font-size: .66rem; font-weight: 700; letter-spacing: .12em; color: var(--muted); text-align: center; padding: 1px 0; }
.vol .rocker { display: flex; border: 1px solid var(--key-line); border-radius: 14px; overflow: hidden; }
.vol .rocker button { background: var(--key); border: 0; width: 56px; height: 48px; display: grid; place-items: center; }
.vol .rocker button + button { border-left: 1px solid var(--key-line); }
.vol .rocker svg { width: 20px; height: 20px; }

/* ---------- aplikace ---------- */
.apps { }
.apps-head { position: absolute; top: 4px; right: 0; z-index: 4; display: flex; align-items: center; gap: 10px; }
.zone.apps { min-height: 48px; }
#apps-body > .app-grid, #apps-body > .empty, #apps-body > p { margin-right: 52px; }
.apps-hint { display: flex; align-items: center; gap: 12px; margin: 0 52px 12px 0; }
.apps-hint p { margin: 0; font-size: .88rem; flex: 1; }
.apps-head .btn { padding: 7px 14px; font-weight: 400; }
.apps-head .icon-btn { background: var(--key); border-color: var(--key-line); }
.pop-wrap { position: relative; }
.pop-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 40; min-width: 220px; padding: 6px; display: grid;
  border-radius: 14px; border: 1px solid var(--glass-edge, var(--line)); background: var(--surface); box-shadow: 0 18px 50px rgba(0,0,0,.35); }
.pop-menu.hidden { display: none; }
.pop-menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0; border-radius: 9px; background: none; color: var(--text); font: inherit; font-size: .95rem; cursor: pointer; }
.pop-menu button.hidden { display: none; }
.pop-menu button:hover, .pop-menu button:focus-visible { background: var(--key); outline: none; }
.app-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.app-tile { position: relative; display: grid; gap: 8px; justify-items: center; text-align: center; background: none; border: 0; padding: 6px 4px; border-radius: 16px; font-size: .88rem; }
.app-tile img, .app-tile .app-fallback { width: 100%; aspect-ratio: 16 / 9; height: auto; border-radius: 12px; object-fit: cover; background: var(--key); border: 1px solid var(--key-line); }
.app-tile .app-fallback { font-size: 1.4rem; }
.app-tile span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.app-tile.is-hidden img, .app-tile.is-hidden .app-fallback { opacity: .3; }
.app-tile.running img, .app-tile.running .app-fallback { outline: 2px solid rgb(var(--glow)); outline-offset: 2px; }
.app-tile .eye { position: absolute; top: 0; right: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; }
.app-tile .eye svg { width: 16px; height: 16px; }
.app-grid.editing .app-tile { touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: grab; }
.app-tile.drag-placeholder { opacity: .25; }
.app-ghost { position: fixed; z-index: 100; pointer-events: none; margin: 0; cursor: grabbing; opacity: .95;
  filter: drop-shadow(0 14px 28px rgba(0,0,0,.45)); transition: none; }

.empty { border: 1px dashed var(--key-line); border-radius: 18px; padding: 22px; color: var(--muted); }
.empty p { margin: 0 0 12px; max-width: 60ch; }
.empty .btn.ghost { color: var(--text); }

/* ---------- dialogy ---------- */
dialog { border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--text); padding: 0; width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); }
dialog::backdrop { background: rgba(5, 8, 18, .6); backdrop-filter: blur(3px); }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.dlg-head h2 { font-size: 1.25rem; }
.dlg-head .icon-btn { margin-left: auto; }
.dlg-body { padding: 8px 20px 22px; }
.dlg-body section { padding: 16px 0; border-bottom: 1px solid var(--line); }
.dlg-body section:last-child { border-bottom: 0; }
.dlg-body h3 { font-size: 1.05rem; margin-bottom: 10px; }
.dlg-body p.muted { margin-top: 0; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0 0 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
.field { display: grid; gap: 4px; margin-bottom: 10px; }
.field label { font-size: .9rem; color: var(--muted); }
.field input, .field-input, .auth input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.fields-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
.seg label { flex: 1; padding: 9px 10px; text-align: center; cursor: pointer; font-size: .92rem; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--surface-2); font-weight: 700; }
.seg label + label { border-left: 1px solid var(--line); }
.dlg-body .btn { background: var(--text); color: var(--bg); }
.dlg-body .btn.ghost { background: transparent; color: var(--text); }
.dlg-body .btn.danger { background: transparent; color: var(--bad); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
pre.log { white-space: pre-wrap; font-size: .8rem; background: var(--surface-2); border-radius: 10px; padding: 10px; max-height: 180px; overflow: auto; }
.status-dot { display: inline-flex; align-items: center; gap: 8px; }
.status-dot::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.status-dot.ok::before { background: var(--good); }
.status-dot.bad::before { background: var(--bad); }
.status-dot.warn::before { background: var(--warn); }
.dev-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.dev-list li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.dev-list .name { font-weight: 700; }
.dev-list small { display: block; color: var(--muted); }
.dev-list button { margin-left: auto; }
.qr { display: grid; justify-items: center; gap: 8px; padding: 12px 0; }
.qr svg { width: 220px; height: 220px; border-radius: 12px; }
.qr-steps { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; align-items: flex-start; }
.qr-step { display: grid; justify-items: center; gap: 10px; text-align: center; max-width: 260px; }
.qr-step p { margin: 0; font-size: .9rem; }
.qr-step .btn { padding: 8px 14px; text-decoration: none; }

.pick-list { display: grid; gap: 8px; }
.pick-list button { text-align: left; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-size: 1.05rem; }

/* ---------- klávesnice ---------- */
#kbd-dlg { width: min(860px, calc(100vw - 16px)); }
.kbd-field { display: flex; gap: 8px; margin-bottom: 14px; }
.kbd-field input { flex: 1; min-width: 0; font-size: 1.15rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.keys { display: grid; gap: 8px; }
.keys .krow { display: flex; gap: 6px; justify-content: center; }
.key {
  flex: 1 1 0; min-width: 0; max-width: 64px; height: 50px; border-radius: 25px; border: 0;
  background: var(--surface-2); font-size: 1.1rem; display: grid; place-items: center;
}
.key.wide { max-width: 120px; flex-grow: 1.6; font-size: .92rem; }
.key.space { max-width: 360px; flex-grow: 5; }
.key.on { background: var(--text); color: var(--bg); }
.key svg { width: 22px; height: 22px; }
@media (max-width: 520px) { .key { height: 44px; font-size: 1rem; } .keys .krow { gap: 4px; } }
.kbd-note { color: var(--muted); font-size: .88rem; margin-top: 12px; }

/* ---------- přihlášení ---------- */
.auth { max-width: 420px; margin: 16vh auto 0; padding: 0 16px; }
.auth h1 { font-size: 2rem; margin-bottom: 8px; }
.auth p { color: var(--muted); margin: 0 0 18px; }
.auth .field input { font-size: 1.05rem; }
.auth .btn { background: var(--text); color: var(--bg); margin-top: 6px; width: 100%; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.25); z-index: 10; }
@media (prefers-reduced-motion: reduce) { .screen-area::before, .vol-osd { transition: none; } }

/* ---------- verze, jazyky, návod ---------- */
.ver { font-size: .8rem; color: var(--muted); font-weight: 400; margin-left: 6px; font-variant-numeric: tabular-nums; }
.langs { position: relative; }
.lang-btn { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px 0 7px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-size: .8rem; font-weight: 700; letter-spacing: .04em; cursor: pointer; }
.lang-btn svg.flag, .lang-menu svg.flag { width: 24px; height: 16px; border-radius: 3px; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.18); flex: none; }
.lang-btn .chev { width: 12px; height: 12px; opacity: .6; transition: transform .15s; }
.lang-btn[aria-expanded=true] .chev { transform: rotate(180deg); }
.lang-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; min-width: 200px; max-height: min(80vh, 600px); overflow-y: auto; padding: 6px; margin: 0; list-style: none;
  border-radius: 14px; border: 1px solid var(--glass-edge, var(--line)); background: var(--surface); box-shadow: 0 18px 50px rgba(0,0,0,.35); backdrop-filter: blur(18px); }
.lang-menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 9px; background: none; color: var(--text); font: inherit; font-size: .92rem; text-align: left; cursor: pointer; }
.lang-menu button:hover, .lang-menu button:focus-visible { background: var(--key, rgba(127,127,127,.12)); outline: none; }
.lang-menu button[aria-checked=true] { font-weight: 700; }
.lang-menu button[aria-checked=true]::after { content: "✓"; margin-left: auto; color: var(--accent, currentColor); }
.lang-menu .code { margin-left: auto; font-size: .72rem; color: var(--muted); letter-spacing: .05em; }
.lang-menu button[aria-checked=true] .code { display: none; }
.auth .langs { display: flex; justify-content: flex-end; margin-bottom: 18px; }
details.guide { border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; margin-bottom: 14px; }
details.guide summary { cursor: pointer; padding: 12px 0; font-weight: 700; }
details.guide ol { margin: 0 0 14px; padding-left: 22px; display: grid; gap: 8px; }
details.guide li b { font-weight: 700; }
details.guide .note { color: var(--muted); font-size: .9rem; margin: 0 0 14px; }
.adb-result { margin: 10px 0 0; }
.offline-pill { font-size: .85rem; color: var(--bad); border: 1px solid var(--bad); border-radius: 999px; padding: 3px 10px; }
.icon-btn.new { position: relative; border-color: rgb(var(--glow)); }
.icon-btn.new::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--good); }
.icon-btn.new svg { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.85); } }
@media (prefers-reduced-motion: reduce) { .icon-btn.new svg { animation: none; } }
.found-list { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }
.found-list li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; }
.found-list .name { font-weight: 700; }
.found-list small { display: block; color: var(--muted); }
.found-list .btn { margin-left: auto; }
</style>
</head>
<body>

<!-- přihlášení / první nastavení -->
<div id="auth" class="auth hidden">
  <div class="langs" data-langs></div>
  <h1 id="auth-title"></h1>
  <p id="auth-text"></p>
  <form id="auth-form">
    <div class="field">
      <label for="auth-pw" id="auth-pw-label"></label>
      <input id="auth-pw" type="password" autocomplete="current-password" required minlength="8">
    </div>
    <div class="field hidden" id="auth-pw2-wrap">
      <label for="auth-pw2" data-i18n="auth.pw2"></label>
      <input id="auth-pw2" type="password" autocomplete="new-password" minlength="8">
    </div>
    <div id="auth-err" class="err"></div>
    <button class="btn" type="submit" id="auth-submit"></button>
  </form>
</div>

<div id="app" class="wrap hidden">
  <div class="ambient" aria-hidden="true"></div>
  <header class="top">
    <h1 id="brand"><img src="/icons/icon.svg" alt="" width="28" height="28"><span class="brand-text"><span>Homemote</span><small>for Google TV</small></span></h1>
    <div class="top-right">
      <div class="langs" data-langs></div>
      <span id="offline" class="offline-pill hidden" data-i18n="live.off"></span>
      <button class="icon-btn" id="open-add" data-i18n-aria="add.title" data-i18n-title="add.title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="open-settings" data-i18n-aria="settings.title" data-i18n-title="settings.title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs hidden" id="tabs" role="tablist" data-i18n-aria="tabs.label"></nav>
  <main class="slab" id="slab">
  <div class="slab-head">
    <div class="tv-head" id="tv-head"></div>
    <div class="tv-meta" id="tv-meta"></div>
    <button class="icon-btn" id="open-diag" data-i18n-aria="diag.open" data-i18n-title="diag.open"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div class="zones" id="zones">
    <section class="zone screen-area" data-zone="screen" data-i18n-aria="screen.label">
      <button class="grip" data-grip data-i18n-aria="layout.move" data-i18n-title="layout.move"><svg viewBox="0 0 22 10" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.6"/><circle cx="11" cy="3" r="1.6"/><circle cx="19" cy="3" r="1.6"/><circle cx="3" cy="8" r="1.6"/><circle cx="11" cy="8" r="1.6"/><circle cx="19" cy="8" r="1.6"/></svg></button>
      <div class="screen-box">
        <div class="screen" id="screen"></div>
        <button class="vol-ring hidden" id="vol-ring" data-i18n-aria="vol.ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="46" fill="rgba(5,7,13,.72)"/>
            <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7" stroke-linecap="round" pathLength="360" stroke-dasharray="270 360" transform="rotate(135 50 50)"/>
            <circle id="vol-arc" cx="50" cy="50" r="38" fill="none" stroke="#F2F4FA" stroke-width="7" stroke-linecap="round" pathLength="360" stroke-dasharray="0 360" transform="rotate(135 50 50)"/>
          </svg>
          <span class="num" id="vol-num"></span>
        </button>
        <div class="vol-osd" id="vol-osd" aria-hidden="true">
          <div class="card">
            <div class="dial">
              <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="6" stroke-linecap="round" pathLength="360" stroke-dasharray="270 360" transform="rotate(135 50 50)"/>
                <circle id="osd-arc" cx="50" cy="50" r="42" fill="none" stroke="#F2F4FA" stroke-width="6" stroke-linecap="round" pathLength="360" stroke-dasharray="0 360" transform="rotate(135 50 50)"/>
              </svg>
              <div class="big" id="osd-num"></div>
            </div>
            <div class="lbl" data-i18n="vol.label"></div>
          </div>
        </div>
      </div>
      <div class="transport" id="transport">
        <button data-key="rewind" data-i18n-aria="key.rewind"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L2.5 12 11 6Zm9.5 0v12L12 12l8.5-6Z"/></svg></button>
        <button data-key="play_pause" class="primary" data-i18n-aria="key.playpause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4.5v15l8-7.5-8-7.5ZM15 5h2.5v14H15zM19.5 5H22v14h-2.5z"/></svg></button>
        <button data-key="stop" data-i18n-aria="key.stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
        <button data-key="forward" data-i18n-aria="key.forward"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6L13 6ZM3.5 6v12L12 12 3.5 6Z"/></svg></button>
      </div>
    </section>

    <section class="zone remote" data-zone="remote" id="remote" data-i18n-aria="remote.label">
      <button class="grip" data-grip data-i18n-aria="layout.move" data-i18n-title="layout.move"><svg viewBox="0 0 22 10" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.6"/><circle cx="11" cy="3" r="1.6"/><circle cx="19" cy="3" r="1.6"/><circle cx="3" cy="8" r="1.6"/><circle cx="11" cy="8" r="1.6"/><circle cx="19" cy="8" r="1.6"/></svg></button>
      <div class="remote-pane">
      <div class="row">
        <button class="rbtn" data-key="power" data-i18n-aria="key.power"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
        <button class="rbtn" data-key="guide" data-i18n="key.guide"></button>
        <button class="rbtn" data-key="settings" data-i18n-aria="key.tvsettings" data-i18n-title="key.tvsettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </div>
      <div class="dpad">
        <button class="up" data-key="up" data-repeat data-i18n-aria="key.up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button>
        <button class="left" data-key="left" data-repeat data-i18n-aria="key.left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
        <button class="ok" data-key="ok" data-hold>OK</button>
        <button class="right" data-key="right" data-repeat data-i18n-aria="key.right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
        <button class="down" data-key="down" data-repeat data-i18n-aria="key.down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      </div>
      <div class="row">
        <button class="rbtn" data-key="back" data-i18n-aria="key.back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="rbtn" data-key="home" data-i18n-aria="key.home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg></button>
        <button class="rbtn" id="open-kbd" data-i18n-aria="kbd.open" data-i18n-title="kbd.open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M7.5 14h9"/></svg></button>
      </div>
      <div class="vol">
        <div class="rocker vert" role="group" data-i18n-aria="vol.label">
          <button data-key="vol_up" data-repeat data-i18n-aria="key.volup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
          <span class="rlbl" aria-hidden="true">VOL</span>
          <button data-key="vol_down" data-repeat data-i18n-aria="key.voldown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
        </div>
        <div class="mid">
          <button class="rbtn" data-key="mute" data-i18n-aria="key.mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg></button>
          <button class="rbtn" id="open-inputs" data-i18n="key.input" data-i18n-aria="key.inputlong"></button>
        </div>
        <div class="rocker vert" role="group" data-i18n-aria="ch.label">
          <button data-key="ch_up" data-repeat data-i18n-aria="key.chup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
          <span class="rlbl" aria-hidden="true">CH</span>
          <button data-key="ch_down" data-repeat data-i18n-aria="key.chdown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
        </div>
      </div>
      </div>
    </section>

    <section class="zone apps" data-zone="apps" data-i18n-aria="apps.title">
      <button class="grip" data-grip data-i18n-aria="layout.move" data-i18n-title="layout.move"><svg viewBox="0 0 22 10" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.6"/><circle cx="11" cy="3" r="1.6"/><circle cx="19" cy="3" r="1.6"/><circle cx="3" cy="8" r="1.6"/><circle cx="11" cy="8" r="1.6"/><circle cx="19" cy="8" r="1.6"/></svg></button>
      <div class="apps-head">
        <div class="pop-wrap">
          <button class="icon-btn hidden" type="button" id="apps-menu-btn" aria-haspopup="menu" aria-expanded="false" data-i18n-aria="apps.menu" data-i18n-title="apps.menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
          <div class="pop-menu hidden" id="apps-menu" role="menu">
            <button type="button" role="menuitem" class="hidden" id="edit-apps" aria-pressed="false"></button>
            <button type="button" role="menuitem" class="hidden" id="open-helper2" data-i18n="helper.title"></button>
          </div>
        </div>
      </div>
      <div id="apps-body"></div>
    </section>
  </div>
  </main>
  <footer class="foot"><span data-i18n="app.name"></span> <span id="ver"></span></footer>
</div>

<!-- nastavení -->
<dialog id="settings" aria-labelledby="settings-title">
  <div class="dlg-head">
    <h2 id="settings-title" data-i18n="settings.title"></h2>
    <button class="icon-btn" data-close data-i18n-aria="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="dlg-body">
    <section>
      <h3 data-i18n="conn.title"></h3>
      <p class="muted" data-i18n="conn.intro"></p>
      <form id="conn-form">
        <div class="field"><label for="c-public" data-i18n="conn.public"></label><input id="c-public" placeholder="https://tv.example.com" inputmode="url"></div>
        <div class="field"><label for="c-local" data-i18n="conn.local"></label><input id="c-local" inputmode="url"></div>
        <button class="btn" type="submit" data-i18n="conn.save"></button>
        <div id="conn-err" class="err"></div>
      </form>
    </section>
    <section>
      <h3 data-i18n="dev.title"></h3>
      <ul class="dev-list" id="dev-list"></ul>
      <div class="btn-row">
        <button class="btn" id="add-phone" data-i18n="dev.addphone"></button>
        <button class="btn ghost" id="logout" data-i18n="dev.logout"></button>
      </div>
      <div class="qr hidden" id="qr"></div>
    </section>
    <section>
      <h3 data-i18n="pw.title"></h3>
      <form id="pw-form">
        <div class="fields-2">
          <div class="field"><label for="pw-old" data-i18n="pw.old"></label><input id="pw-old" type="password" autocomplete="current-password" required></div>
          <div class="field"><label for="pw-new" data-i18n="pw.new"></label><input id="pw-new" type="password" autocomplete="new-password" minlength="8" required></div>
        </div>
        <button class="btn" type="submit" data-i18n="pw.btn"></button>
        <div id="pw-err" class="err"></div>
      </form>
    </section>
    <section>
      <p class="muted" style="margin:0" id="about"></p>
    </section>
  </div>
</dialog>

<!-- přidání zařízení -->
<dialog id="add-dlg" aria-labelledby="add-title">

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
/* Aplikace pro telefon předá token z párování v URL (#hm_token=…); uložit a z adresy odstranit. */
(() => {
  const m = /[#&]hm_token=([^&]+)/.exec(location.hash);
  if (!m) return;
  try { store.set("hm.token", decodeURIComponent(m[1])); } catch {}
  history.replaceState(null, "", location.pathname + location.search);
})();

  for (const n of (navigator.languages || [navigator.language || ""])) { const c = n.toLowerCase().split("-")[0]; if (LANG_CODES.includes(c)) return c; }

async function loadLang(code) {
  if (I18N[code]) return true;
  try { const r = await fetch(`/i18n/${code}.json`, { cache: "no-cache" }); if (!r.ok) return false; I18N[code] = (await r.json()).ui; return true; }
  catch { return false; }
}
function t(key, p = {}) {
  const s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? I18N.cs[key] ?? key;

}

}

async function api(path, opts = {}) {
  const headers = { "X-Lang": LANG, ...(opts.body ? { "Content-Type": "application/json" } : {}), ...(S.token ? { Authorization: "Bearer " + S.token } : {}) };
  const res = await fetch("/api" + path, { ...opts, headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = res.headers.get("content-type")?.includes("json") ? await res.json() : null;
  if (res.status === 401 && !path.startsWith("/auth/")) { S.token = null; store.set("hm.token", null); showAuth(); throw new Error("unauthorized"); }
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
  return data;
}

    S.wsOk = false; renderLive();
    if (ev.code === 4401) { S.token = null; store.set("hm.token", null); showAuth(); return; }
    setTimeout(() => { if (S.ws === ws) connectWS(); }, 2000);
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "snapshot") {
      S.tvs.clear(); m.tvs.forEach(x => S.tvs.set(x.id, x)); S.endpoints = m.endpoints; S.android = m.android || null; render();
    } else if (m.type === "android") {

      if (m.android?.state === "ready" && $("#qr .android-wait")) $("#add-phone").click();  // aplikace hotová → ukázat i QR ke stažení
    } else if (m.type === "tv") {
      const prev = S.tvs.get(m.tv.id); S.tvs.set(m.tv.id, m.tv);

    } else if (m.type === "endpoints") {

      const tv = S.tvs.get(m.tv_id); if (tv) tv.ime = m.ime;
      if (m.tv_id !== S.sel) return;
      const dlg = $("#kbd-dlg");
      if (m.ime.active && !dlg.open && !document.querySelector("dialog[open]")) { openKeyboard(true); S.kbFromTv = true; }
      else if (!m.ime.active && dlg.open && S.kbFromTv) dlg.close();

    } else if (m.type === "key_result") {

    } else if (m.type === "error") toast(m.error);
  };
}

/* ===== přeuspořádání aplikací přetažením (v režimu Upravit) =====

const appDrag = { s: null, justDropped: false };
function appOrderFromDom() { return [...document.querySelectorAll("#apps-body .app-tile")].map(t => t.dataset.pkg); }
async function saveAppOrder(before) {
  const order = appOrderFromDom();
  if (before && order.join("\n") === before.join("\n")) return;
  const rank = new Map(order.map((p, i) => [p, i]));
  S.apps.sort((a, b) => (rank.get(a.package) ?? 1e9) - (rank.get(b.package) ?? 1e9));

  catch (err) { toast(err.message); }
}
function appDragStart(ev) {
  const d = appDrag.s; if (!d || d.active) return;
  d.active = true;
  const r = d.tile.getBoundingClientRect();
  d.offX = d.x - r.left; d.offY = d.y - r.top;
  d.ghost = d.tile.cloneNode(true);
  d.ghost.classList.add("app-ghost");
  Object.assign(d.ghost.style, { width: r.width + "px", height: r.height + "px", left: "0px", top: "0px" });
  document.body.appendChild(d.ghost);
  d.tile.classList.add("drag-placeholder");

}
function appDragMove(x, y) {
  const d = appDrag.s; if (!d || !d.active) return;

  const over = document.elementFromPoint(x, y)?.closest?.("#apps-body .app-tile");
  if (over && over !== d.tile) {
    const r = over.getBoundingClientRect();
    const after = (y > r.bottom - r.height * 0.25) || (x > r.left + r.width / 2 && y > r.top + r.height * 0.1);
    over.parentNode.insertBefore(d.tile, after ? over.nextSibling : over);
  }

  if (d.scroll && !d.scrollT) d.scrollT = setInterval(() => { if (appDrag.s?.scroll) scrollBy(0, appDrag.s.scroll); }, 16);

  saveAppOrder(d.before);
}
$("#apps-body").addEventListener("pointerdown", (e) => {
  if (!S.editApps || e.button > 0) return;
  const tile = e.target.closest(".app-tile"); if (!tile) return;
  appDrag.s = { tile, id: e.pointerId, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, active: false, touch: e.pointerType !== "mouse" };

document.addEventListener("pointermove", (e) => {

});

/* Úchyty pro přesun bloků: skryté, objeví se u horního okraje bloku (myš), na dotyk po klepnutí do pruhu u okraje. */
(() => {
  const BAND = 30;
  const near = (z, x, y) => { const r = z.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top - 18 && y <= r.top + BAND; };
  document.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    document.querySelectorAll(".zone").forEach(z => z.classList.toggle("grip-near", near(z, e.clientX, e.clientY)));
  }, { passive: true });
  document.addEventListener("pointerleave", () => document.querySelectorAll(".zone.grip-near").forEach(z => z.classList.remove("grip-near")));
  let hideT = null;
  document.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse") return;
    const z = [...document.querySelectorAll(".zone")].find(z => near(z, e.clientX, e.clientY));
    if (!z) return;
    document.querySelectorAll(".zone.grip-near").forEach(o => o !== z && o.classList.remove("grip-near"));
    z.classList.add("grip-near"); clearTimeout(hideT);
    hideT = setTimeout(() => { if (!z.classList.contains("moving")) z.classList.remove("grip-near"); }, 4000);
  }, true);
})();

let repeatT = null;
/* Tlačítka s data-hold (OK): krátký stisk = SHORT, podržení = START_LONG … END_LONG (kontextová nabídka).

let hold = null;
function endHold(cancel) {
  if (!hold) return;
  clearTimeout(hold.timer);

    const key = b.dataset.key;
    hold = { key, btn: b, long: false, timer: setTimeout(() => {
      if (!hold) return;
      hold.long = true; b.classList.add("holding"); sendKey(key, "START_LONG");
      if (navigator.vibrate) try { navigator.vibrate(25); } catch {}
    }, 450) };
    return;
  }
  sendKey(b.dataset.key);
  if (b.hasAttribute("data-repeat")) {

  }

const KB = {
  lower: [["1","2","3","4","5","6","7","8","9","0"], ["q","w","e","r","t","z","u","i","o","p"], ["a","s","d","f","g","h","j","k","l"], ["shift","y","x","c","v","b","n","m","del"], ["alt","@",".","space","-","enter"]],
  alt: [["ě","š","č","ř","ž","ý","á","í","é","ú"], ["ů","ď","ť","ň","ó","?","!",",",":",";"], ["(",")","/","\\","&","%","#","_","'"], ["shift","\"","+","=","*","<",">","~","del"], ["abc","@",".","space","-","enter"]],
};
let kbShift = false, kbLayer = "lower", kbPrev = "";
const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7Z"/><path d="m12 9 5 6M17 9l-5 6"/></svg>';
const ICON_SHIFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 4 3 13h5v7h8v-7h5L12 4Z"/></svg>';
function renderKeys() {
  $("#keys").innerHTML = KB[kbLayer].map(row => `<div class="krow">${row.map(k => {
    if (k === "shift") return `<button class="key wide ${kbShift ? "on" : ""}" data-k="shift" aria-label="${esc(t("kbd.shift"))}" aria-pressed="${kbShift}">${ICON_SHIFT}</button>`;
    if (k === "del") return `<button class="key wide" data-k="del" aria-label="${esc(t("kbd.del"))}">${ICON_DEL}</button>`;
    if (k === "space") return `<button class="key space" data-k="space" aria-label="${esc(t("kbd.space"))}"></button>`;
    if (k === "enter") return `<button class="key wide" data-k="enter">${esc(t("kbd.done"))}</button>`;
    if (k === "alt") return `<button class="key wide" data-k="alt">ěšč</button>`;
    if (k === "abc") return `<button class="key wide" data-k="abc">abc</button>`;
    const ch = kbShift ? k.toUpperCase() : k;

  }).join("")}</div>`).join("");
}
/* Na backend jde vždy požadovaný CELÝ obsah pole – backend z rozdílu pošle mazání a vložení. */
let kbTimer = null, kbLocalEdit = 0;
function syncField(value) {
  kbLocalEdit = Date.now();

}

$("#open-add").onclick = openAdd;
function renderFound() {
  const list = found(), ul = $("#found-list");
  ul.innerHTML = list.length
    ? list.map(x => `<li><div><span class="name">${esc(x.name)}</span><small>${esc(x.host || "")}</small></div><button class="btn" data-adopt="${esc(x.id)}">${esc(t("add.adopt"))}</button></li>`).join("")
    : `<li class="muted" style="border-style:dashed">${esc(t("add.none"))}</li>`;
}
$("#found-list").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-adopt]"); if (!b) return;
  try {
    const x = await api(`/tvs/${encodeURIComponent(b.dataset.adopt)}/adopt`, { method: "POST" });
    S.tvs.set(x.id, x); S.sel = x.id; store.set("hm.tv", x.id); S.appsFor = null; S.pairing = false;
    $("#add-dlg").close(); render(); toast(t("add.done", { name: x.name }));
  } catch (err) { toast(err.message); }
});
function renderHelper() {
  const tv = cur(), h = tv?.helper || {};
  $("#helper-status").innerHTML = !tv ? "" : h.connected
    ? `<span class="status-dot ok">${esc(t("helper.running") + (h.version ? t("helper.version", { v: h.version }) : "") + (h.listener_enabled === false ? t("helper.noListener") : ""))}</span>`
    : `<span class="status-dot bad">${esc(t("helper.notConnected") + (h.error ? ": " + h.error : ""))}</span>`;
  if (tv && !h.connected && !$("#adb-guide").dataset.touched) $("#adb-guide").open = true;
  const a = S.android;
  if (a && (a.state === "building" || a.state === "installing-jdk" || a.state === "error") && !h.connected) {
    $("#helper-status").innerHTML += `<p class="muted" style="margin:8px 0 0">${esc(a.state === "error" ? t("android.error", { err: a.error || "" }) : t("android.building"))}</p>`;
  }
}

function renderDiag() {
  const tv = cur(), di = tv?.device_info || {};
  const st = !tv ? "" : !tv.paired ? t("state.unpaired") : tv.online ? (tv.is_on === false ? t("state.connectedStandby") : t("state.connected")) : t("state.offline");
  $("#set-tv").innerHTML = tv ? `<h3>${esc(t("set.tv"))}</h3><dl class="facts">
      <dt>${esc(t("set.name"))}</dt><dd>${esc(tv.name)}</dd>
      ${di.manufacturer ? `<dt>${esc(t("set.vendor"))}</dt><dd>${esc(di.manufacturer)}</dd>` : ""}
      ${di.model ? `<dt>${esc(t("set.model"))}</dt><dd>${esc(di.model)}</dd>` : ""}
      ${di.sw_version ? `<dt>${esc(t("set.system"))}</dt><dd>${esc(di.sw_version)}</dd>` : ""}
      <dt>${esc(t("set.ip"))}</dt><dd>${esc(tv.host || "–")}</dd>
      <dt>${esc(t("set.mac"))}</dt><dd>${esc(tv.id)}</dd>
      <dt>${esc(t("set.state"))}</dt><dd><span class="status-dot ${stClass(tv)}">${esc(st)}</span></dd>
    </dl>
    <div class="btn-row" style="margin-bottom:16px"><button class="btn ghost" id="diag-helper">${esc(t("helper.title"))}</button></div>
    <button class="btn danger" id="remove-tv">${esc(t("set.remove"))}</button>
    <p class="muted" style="margin:8px 0 0">${esc(t("set.removeNote"))}</p>`
    : `<h3>${esc(t("set.tv"))}</h3><p class="muted">${esc(t("set.noTv"))}</p>`;
  $("#diag-helper") && ($("#diag-helper").onclick = () => { $("#diag-dlg").close(); openHelper(); });
  $("#remove-tv") && ($("#remove-tv").onclick = async () => {
    if (!confirm(t("set.removeConfirm", { name: tv.name }))) return;
    try { await api(tvPath(), { method: "DELETE" }); $("#diag-dlg").close(); toast(t("set.removed")); }
    catch (e) { toast(e.message); }
  });
}
$("#adb-guide").addEventListener("toggle", () => { $("#adb-guide").dataset.touched = "1"; });
async function loadSettings() {
  try {
    const s = await api("/settings");
    $("#c-public").value = s.public_url; $("#c-local").value = s.local_url; $("#c-local").placeholder = t("conn.auto", { url: s.local_url_auto });
  } catch {}
  loadDevices();
}
async function loadDevices() {
  try {
    const devs = await api("/auth/devices");
    const locale = { cs: "cs-CZ", en: "en-GB", pt: "pt-PT", zh: "zh-CN" }[LANG] || LANG;
    $("#dev-list").innerHTML = devs.map(d => `<li><div><span class="name">${esc(d.name)}</span><small>${esc(d.current ? t("dev.this") : t("dev.last", { when: new Date(d.last_seen * 1000).toLocaleString(locale) }))}</small></div>
      ${d.current ? "" : `<button class="btn ghost" data-revoke="${esc(d.id)}">${esc(t("dev.revoke"))}</button>`}</li>`).join("");
  } catch {}
}
$("#dev-list").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-revoke]"); if (!b) return;
  try { await api(`/auth/devices/${b.dataset.revoke}`, { method: "DELETE" }); loadDevices(); } catch (err) { toast(err.message); }
});
$("#add-phone").onclick = async () => {
  try {
    const r = await api("/auth/pair", { method: "POST" });
    const q = $("#qr"); q.classList.remove("hidden");
    const pairBox = `<div class="qr-step">${r.app ? `<b>${esc(t("dev.step2"))}</b>` : ""}${r.svg}<p class="muted">${esc(t("dev.qr"))}</p></div>`;
    const appBox = r.app ? `<div class="qr-step"><b>${esc(t("dev.step1"))}</b>${r.app.svg}<p class="muted">${esc(t("dev.step1Text"))}</p><a class="btn ghost" href="${esc(r.app.url)}" download>${esc(t("dev.download"))}</a></div>` : "";
    const building = !r.app && S.android && (S.android.state === "building" || S.android.state === "installing-jdk");
    q.innerHTML = `<div class="qr-steps">${appBox}${pairBox}</div>` + (building ? `<p class="muted android-wait" style="text-align:center;margin:12px 0 0">${esc(t("android.building"))}</p>` : "");
    clearTimeout(q._t); q._t = setTimeout(() => { q.classList.add("hidden"); loadDevices(); }, r.expires_in * 1000);
  } catch (e) { toast(e.message); }
};
$("#logout").onclick = async () => {
  try { await api("/auth/logout", { method: "POST" }); } catch {}
  S.token = null; store.set("hm.token", null); showAuth();
};
$("#conn-form").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#conn-err").textContent = "";
  try { await api("/settings", { method: "PUT", body: { public_url: $("#c-public").value, local_url: $("#c-local").value } }); toast(t("conn.saved")); }
  catch (err) { $("#conn-err").textContent = err.message; }
});
async function loadLogs() {
  const box = $("#log-box"); delete box.dataset.hint;
  try {
    const r = await api(`/logs?q=${encodeURIComponent($("#log-q").value.trim())}`);
    box.textContent = r.lines.length ? r.lines.join("\n") : t("diag.empty");
    box.scrollTop = box.scrollHeight;
  } catch (e) { box.textContent = e.message; }
}
$("#log-load").onclick = loadLogs;
$("#log-q").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); loadLogs(); } });
/* Schránka: navigator.clipboard funguje jen přes HTTPS / localhost, na http://IP je potřeba starší cesta. */
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) { try { await navigator.clipboard.writeText(text); return true; } catch {} }
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  ($("dialog[open]") || document.body).appendChild(ta);
  ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand("copy"); } catch {}
  ta.remove();
  return ok;
}
$("#ui-dump").onclick = async () => {
  const box = $("#log-box"), btn = $("#ui-dump");
  btn.disabled = true; delete box.dataset.hint; box.textContent = t("diag.uiLoading");
  try { const r = await api(tvPath("/adb/uidump"), { method: "POST" }); box.textContent = (r.xml || "").replace(/></g, ">\n<") || t("diag.empty"); }
  catch (err) { box.textContent = err.message; }
  finally { btn.disabled = false; }
};
$("#log-copy").onclick = async () => { toast(await copyText($("#log-box").textContent) ? t("diag.copied") : t("diag.copyFailed")); };
$("#pw-form").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#pw-err").textContent = "";
  try { await api("/auth/password", { method: "PUT", body: { old: $("#pw-old").value, new: $("#pw-new").value } }); e.target.reset(); toast(t("pw.done")); }
  catch (err) { $("#pw-err").textContent = err.message; }
});

/* ---- ADB a pomocník ---- */
function adbBody() {
  const w = $("#helper-form").mode.value === "wireless";
  const body = { connect_port: +$("#h-connect").value || 5555 };
  if (w) { body.pair_port = +$("#h-pport").value || null; body.pair_code = $("#h-pcode").value.trim(); }
  return body;
}
$("#helper-form").addEventListener("change", (e) => {
  if (e.target.name !== "mode") return;
  const w = e.target.value === "wireless";
  document.querySelectorAll("#helper-form .wireless").forEach(el => el.classList.toggle("hidden", !w));
  $("#h-connect").value = w ? "" : "5555";
});
$("#adb-test").onclick = async () => {
  if (!cur()) return;
  const btn = $("#adb-test"), res = $("#adb-result");
  btn.disabled = true; btn.textContent = t("adb.testing"); res.innerHTML = ""; $("#helper-err").textContent = "";
  try {
    const r = await api(tvPath("/adb/test"), { method: "POST", body: adbBody() });
    res.innerHTML = `<span class="status-dot ok">${esc(t("adb.ok", { model: r.model, android: r.android }))}</span>`;
  } catch (err) { $("#helper-err").textContent = err.message; }
  finally { btn.disabled = false; btn.textContent = t("adb.test"); }
};
$("#helper-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!cur()) return;
  const btn = $("#helper-submit"); btn.disabled = true; btn.textContent = t("helper.installing");
  $("#helper-err").textContent = ""; $("#helper-log").classList.add("hidden");
  try {
    const r = await api(tvPath("/helper/setup"), { method: "POST", body: adbBody() });
    $("#helper-log").textContent = r.log.join("\n"); $("#helper-log").classList.remove("hidden");
    toast(r.ok ? t("helper.installed") : t("helper.installedNoReply"));
  } catch (err) { $("#helper-err").textContent = err.message; }
  finally { btn.disabled = false; btn.textContent = t("helper.install"); }
});
$("#helper-retry").onclick = async () => {
  if (!cur()) return;
  try { const r = await api(tvPath("/helper/connect"), { method: "POST" }); toast(r.ok ? t("helper.connected") : t("helper.noReply")); }
  catch (err) { $("#helper-err").textContent = err.message; }
};
$("#add-form").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#add-err").textContent = "";
  try { const x = await api("/tvs", { method: "POST", body: { host: $("#add-host").value.trim() } }); S.tvs.set(x.id, x); S.sel = x.id; store.set("hm.tv", x.id); toast(t("add.done", { name: x.name })); $("#add-dlg").close(); render(); }
  catch (err) { $("#add-err").textContent = err.message; }
});

/* ================= start ================= */
async function start() {
  if (!S.token) { showAuth(); return; }
  try { (await api("/tvs")).forEach(x => S.tvs.set(x.id, x)); }
  catch (e) { if (e.message !== "unauthorized") toast(e.message); return; }
  $("#auth").classList.add("hidden"); $("#app").classList.remove("hidden");
  render(); renderLive(); connectWS();
}
loadLang(LANG).then(ok => { if (!ok) LANG = "en"; applyI18n(); loadVersion(); start(); });
</script>
</body>
</html>
