# Homemote – docker compose up -d
# Update: docker compose pull && docker compose up -d
services:
  homemote-backend:
    image: ghcr.io/tlkounev/homemote-backend:latest
    container_name: homemote-backend
    restart: unless-stopped
    network_mode: host        # TV discovery (mDNS) needs the container directly in the home LAN
    volumes:
      - ./data:/data          # state, pairing certificate, sign-ins
    environment:
      PORT: "888"             # web UI + API port
