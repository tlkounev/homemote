name: Build & release

# Při změně backendu: sestaví APK (pomocník na TV, aplikace pro telefon), Docker image s nimi
# (ghcr.io/<vlastník>/homemote-backend) a pro novou verzi z backend/app/version.py vytvoří Release s APK.
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write   # Release
  packages: write   # GHCR

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verze a název image
        run: |
          echo "VERSION=$(sed -nE 's/^VERSION = "(.+)"/\1/p' backend/app/version.py)" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homemote-backend" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Nástroje pro sestavení APK (cache)
        uses: actions/cache@v4
        with:
          path: .apk-tools
          key: apk-tools-${{ hashFiles('backend/android/build.py') }}

      - name: Podpisové klíče ze Secrets
        env:
          KEY_HELPER: ${{ secrets.HM_KEY_HELPER }}
          KEY_PHONE: ${{ secrets.HM_KEY_PHONE }}
        run: |
          if [ -z "$KEY_HELPER" ] || [ -z "$KEY_PHONE" ]; then
            echo "::error::Missing signing keys. Add repository secrets HM_KEY_HELPER and HM_KEY_PHONE (base64 of homemote-helper.jks / homemote-phone.jks) – see README, section Signing keys."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_HELPER" | base64 -d > "$RUNNER_TEMP/keys/homemote-helper.jks"
          printf '%s' "$KEY_PHONE" | base64 -d > "$RUNNER_TEMP/keys/homemote-phone.jks"

      - name: Sestavení APK
        env:
          HM_OUT: backend/apk-dist
          HM_TOOLS: .apk-tools
          HM_KEYS: ${{ runner.temp }}/keys
          HM_WORK: ${{ runner.temp }}/apk-build
        run: |
          python3 backend/android/build.py
          python3 - <<'EOF'
          import json, pathlib
          android = pathlib.Path("backend/android")
          versions = {n: json.loads((android / n / "app.json").read_text())["version_name"] for n in ("helper", "phone")}
          pathlib.Path("backend/apk-dist/apk-versions.json").write_text(json.dumps(versions, indent=1))
          print(versions)
          EOF
          rm -rf "$RUNNER_TEMP/keys"
          ls -l backend/apk-dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release (jen nová verze)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG už existuje – přeskakuji."
            exit 0
          fi
          NOTES=$(awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} f && /^## / {exit} f' CHANGELOG.md)
          printf '%s\n\nDocker image: `%s:%s`\n' "$NOTES" "$IMAGE" "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Homemote $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "backend/apk-dist/helper.apk#Homemote helper (TV)" \
            "backend/apk-dist/homemote.apk#Homemote (phone app)"
